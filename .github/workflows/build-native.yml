name: Build Native Clients

on:
  workflow_dispatch:
    inputs:
      publish_apple:
        description: Upload signed Apple builds to App Store Connect
        required: false
        default: false
        type: boolean
      apple_platform:
        description: Apple platform to upload
        required: false
        default: all
        type: choice
        options:
          - all
          - ios
          - macos
      apple_build_number:
        description: Positive App Store build number; defaults to the workflow run number
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".gitattributes"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES.html"
      - "THIRD_PARTY_NOTICES.md"
      - "contracts/**"
      - "native/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/build.rs"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-third-party-licenses.mjs"
      - "scripts/native-*.sh"
      - "scripts/package-validation.sh"
      - ".github/workflows/build-native.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES.html"
      - "THIRD_PARTY_NOTICES.md"
      - "contracts/**"
      - "native/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/build.rs"
      - "package.json"
      - "package-lock.json"
      - "scripts/generate-third-party-licenses.mjs"
      - "scripts/native-*.sh"
      - "scripts/package-validation.sh"
      - ".github/workflows/build-native.yml"

permissions:
  contents: read

jobs:
  apple:
    name: Apple builds, archives, platform tests, and shared Rust tests
    runs-on: macos-26
    timeout-minutes: 30
    env:
      RELEASE_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify third-party license bundle
        run: npm run licenses:check

      - name: Run Rust contract and unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Require Xcode 26 and iOS 26 SDK
        run: |
          set -euo pipefail
          xcode_version="$(xcodebuild -version | sed -n '1s/^Xcode //p')"
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          [[ "$xcode_version" == 26.* ]]
          [[ "$ios_sdk" == 26.* ]]

      - name: Build Apple clients and run platform unit tests
        run: ./scripts/native-apple-build.sh

      - name: Package native macOS preview
        run: ./scripts/native-macos-package.sh "$RELEASE_LABEL"

      - name: Package unsigned native iOS archive
        run: ./scripts/native-ios-package.sh "$RELEASE_LABEL"

      - name: Upload native macOS preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-native-macos-universal
          path: |
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-macos-universal.zip
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-macos-universal.zip.sha256
          if-no-files-found: error

      - name: Upload unsigned native iOS archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-native-ios-unsigned-archive
          path: |
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-ios-unsigned.xcarchive.zip
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-ios-unsigned.xcarchive.zip.sha256
          if-no-files-found: error

  android-debug:
    name: Android Debug tests, lint, and build
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify third-party license bundle
        run: npm run licenses:check

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android unit tests, lint, and debug build
        run: ./scripts/native-android-build.sh

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-native-android-debug-${{ github.sha }}
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  apple-app-store:
    name: Upload signed Apple builds to App Store Connect
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_apple }}
    needs: apple
    runs-on: macos-26
    timeout-minutes: 45
    environment: app-store-production

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Require Apple signing secrets
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_AUTH_KEY_BASE64: ${{ secrets.APPLE_AUTH_KEY_BASE64 }}
          APPLE_AUTH_KEY_ID: ${{ secrets.APPLE_AUTH_KEY_ID }}
          APPLE_AUTH_KEY_ISSUER_ID: ${{ secrets.APPLE_AUTH_KEY_ISSUER_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_IOS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROFILE_BASE64 }}
          APPLE_MACOS_PROFILE_BASE64: ${{ secrets.APPLE_MACOS_PROFILE_BASE64 }}
          APPLE_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for variable in \
            APPLE_DEVELOPMENT_TEAM \
            APPLE_AUTH_KEY_BASE64 \
            APPLE_AUTH_KEY_ID \
            APPLE_AUTH_KEY_ISSUER_ID \
            APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APPLE_INSTALLER_CERTIFICATE_P12_BASE64 \
            APPLE_INSTALLER_CERTIFICATE_PASSWORD \
            APPLE_IOS_PROFILE_BASE64 \
            APPLE_MACOS_PROFILE_BASE64 \
            APPLE_WIDGET_PROFILE_BASE64; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Apple App Store secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Archive and upload Apple builds
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          APPLE_AUTH_KEY_BASE64: ${{ secrets.APPLE_AUTH_KEY_BASE64 }}
          APPLE_AUTH_KEY_ID: ${{ secrets.APPLE_AUTH_KEY_ID }}
          APPLE_AUTH_KEY_ISSUER_ID: ${{ secrets.APPLE_AUTH_KEY_ISSUER_ID }}
          APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_IOS_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROFILE_BASE64 }}
          APPLE_MACOS_PROFILE_BASE64: ${{ secrets.APPLE_MACOS_PROFILE_BASE64 }}
          APPLE_WIDGET_PROFILE_BASE64: ${{ secrets.APPLE_WIDGET_PROFILE_BASE64 }}
          APPLE_BUILD_NUMBER_INPUT: ${{ inputs.apple_build_number }}
          APPLE_PLATFORM: ${{ inputs.apple_platform }}
          WORKFLOW_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          umask 077
          auth_key_path="$RUNNER_TEMP/AuthKey_${APPLE_AUTH_KEY_ID}.p8"
          distribution_cert_path="$RUNNER_TEMP/apple-distribution.p12"
          installer_cert_path="$RUNNER_TEMP/mac-installer-distribution.p12"
          ios_profile_path="$RUNNER_TEMP/ios-app-store.mobileprovision"
          macos_profile_path="$RUNNER_TEMP/macos-app-store.provisionprofile"
          widget_profile_path="$RUNNER_TEMP/widget-app-store.provisionprofile"
          keychain_path="$RUNNER_TEMP/app-store-signing.keychain-db"
          keychain_password="$(uuidgen)"
          mobile_profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          xcode_profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          installed_profiles=()
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f \
              "$auth_key_path" \
              "$distribution_cert_path" \
              "$installer_cert_path" \
              "$ios_profile_path" \
              "$macos_profile_path" \
              "$widget_profile_path"
            if (( ${#installed_profiles[@]} > 0 )); then
              rm -f "${installed_profiles[@]}"
            fi
          }
          trap cleanup EXIT
          printf '%s' "$APPLE_AUTH_KEY_BASE64" | base64 -D > "$auth_key_path"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_P12_BASE64" | base64 -D > "$distribution_cert_path"
          printf '%s' "$APPLE_INSTALLER_CERTIFICATE_P12_BASE64" | base64 -D > "$installer_cert_path"
          printf '%s' "$APPLE_IOS_PROFILE_BASE64" | base64 -D > "$ios_profile_path"
          printf '%s' "$APPLE_MACOS_PROFILE_BASE64" | base64 -D > "$macos_profile_path"
          printf '%s' "$APPLE_WIDGET_PROFILE_BASE64" | base64 -D > "$widget_profile_path"
          test -s "$auth_key_path"
          test -s "$distribution_cert_path"
          test -s "$installer_cert_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          # No -A: only the codesign/productbuild/security allowlist below may use the imported keys.
          security import "$distribution_cert_path" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -f pkcs12 -k "$keychain_path" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$installer_cert_path" \
            -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" \
            -f pkcs12 -k "$keychain_path" \
            -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          install_profile() {
            local source="$1" extension="$2" uuid destination
            uuid="$(security cms -D -i "$source" | plutil -extract UUID raw -)"
            [[ "$uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]
            mkdir -p "$mobile_profiles_dir" "$xcode_profiles_dir"
            destination="$xcode_profiles_dir/$uuid.$extension"
            cp "$source" "$destination"
            installed_profiles+=("$destination")
            if [[ "$extension" == "mobileprovision" ]]; then
              destination="$mobile_profiles_dir/$uuid.mobileprovision"
              cp "$source" "$destination"
              installed_profiles+=("$destination")
            fi
          }
          install_profile "$ios_profile_path" mobileprovision
          install_profile "$macos_profile_path" provisionprofile
          install_profile "$widget_profile_path" provisionprofile

          security find-identity -v -p codesigning "$keychain_path" \
            | grep -F 'Apple Distribution:' >/dev/null
          security find-identity -v -p basic "$keychain_path" \
            | grep -E '3rd Party Mac Developer Installer:|Mac Installer Distribution:' >/dev/null

          export APPLE_AUTH_KEY_PATH="$auth_key_path"
          export APPLE_BUILD_NUMBER="${APPLE_BUILD_NUMBER_INPUT:-$WORKFLOW_BUILD_NUMBER}"
          ./scripts/native-apple-app-store.sh upload "$APPLE_PLATFORM"

  android-release:
    name: Android signed release package
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.publish_apple) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci-signing' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install npm dependencies
        run: npm ci

      - name: Verify third-party license bundle
        run: npm run licenses:check

      - name: Require Android release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              missing+=("$variable")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Android release signing secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build signed universal native Android package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keystore_path="$RUNNER_TEMP/where-to-study-release.jks"
          trap 'rm -f "$keystore_path"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          if [[ ! -s "$keystore_path" ]]; then
            echo "Decoded Android release keystore is empty." >&2
            exit 1
          fi

          export ANDROID_SIGNING_STORE_FILE="$keystore_path"
          export ANDROID_SIGNING_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
          export ANDROID_SIGNING_KEY_ALIAS="$ANDROID_KEY_ALIAS"
          export ANDROID_SIGNING_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          ./scripts/native-android-package.sh "$RELEASE_LABEL"

      - name: Upload signed universal native Android package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-native-android-signed-universal-${{ env.RELEASE_LABEL }}
          path: |
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-android-universal.apk
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-android-universal.apk.sha256
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-android.aab
            release-artifacts/Where-To-Study-${{ env.RELEASE_LABEL }}-native-android.aab.sha256
          if-no-files-found: error
