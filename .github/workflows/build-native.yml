name: Build Native Clients

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "contracts/**"
      - "native/**"
      - "scripts/native-*.sh"
      - ".github/workflows/build-native.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "native/**"
      - "scripts/native-*.sh"
      - ".github/workflows/build-native.yml"

permissions:
  contents: read

jobs:
  apple:
    name: Apple native build and tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build macOS and iOS clients
        run: ./scripts/native-apple-build.sh

      - name: Package native macOS preview
        run: ./scripts/native-macos-package.sh ci

      - name: Upload native macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: where-to-study-native-macos-universal
          path: |
            release-artifacts/Where-To-Study-ci-native-macos-universal.zip
            release-artifacts/Where-To-Study-ci-native-macos-universal.zip.sha256
          if-no-files-found: error

  android:
    name: Android native build, tests, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build native Android client
        run: ./scripts/native-android-build.sh

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: where-to-study-native-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
