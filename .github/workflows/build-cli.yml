name: Build CLI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "wts-cli/**"
      - "where-to-study-core/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/build-cli.yml"
  pull_request:
    paths:
      - "wts-cli/**"
      - "where-to-study-core/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/build-cli.yml"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: |
            ./src-tauri
            ./where-to-study-core
            ./wts-cli

      - name: Check Rust formatting
        run: cargo fmt --manifest-path wts-cli/Cargo.toml --all -- --check

      - name: Run strict Clippy checks
        run: cargo clippy --manifest-path wts-cli/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test CLI
        run: cargo test --manifest-path wts-cli/Cargo.toml --locked

      - name: Build CLI release
        run: cargo build --manifest-path wts-cli/Cargo.toml --release --locked

      - name: Upload CLI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-cli-macos-arm64
          path: wts-cli/target/release/where-to-study-cli
          if-no-files-found: error

  linux:
    name: Linux CLI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: |
            ./where-to-study-core
            ./wts-cli

      - name: Test and build CLI
        run: |
          set -euo pipefail
          cargo test --manifest-path wts-cli/Cargo.toml --locked
          cargo build --manifest-path wts-cli/Cargo.toml --release --locked
          file wts-cli/target/release/where-to-study-cli
          wts-cli/target/release/where-to-study-cli --version | grep -F '0.2.7'
          [[ "$(uname -m)" == "${{ matrix.arch }}" ]]

      - name: Package Linux CLI
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          archive="where-to-study-cli-linux-${{ matrix.arch }}.tar.gz"
          tar -C wts-cli/target/release -czf "release-artifacts/$archive" where-to-study-cli
          tar -tzf "release-artifacts/$archive" | grep -qx 'where-to-study-cli'
          (cd release-artifacts && sha256sum "$archive" > "$archive.sha256")

      - name: Upload Linux CLI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-cli-linux-${{ matrix.arch }}
          path: |
            release-artifacts/where-to-study-cli-linux-${{ matrix.arch }}.tar.gz
            release-artifacts/where-to-study-cli-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
