name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS Apple Silicon bundle
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build macOS app
        run: npm run tauri -- build --target aarch64-apple-darwin --features custom-protocol --ci

      - name: Sign, verify, and package app
        run: ./scripts/macos-package.sh "$GITHUB_REF_NAME"
        env:
          MACOS_APP_PATH: ${{ github.workspace }}/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Where To Study.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: where-to-study-macos-arm64
          path: release-artifacts/*
          if-no-files-found: error
