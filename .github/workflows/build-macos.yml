name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS Apple Silicon bundle
    runs-on: macos-15
    timeout-minutes: 30
    env:
      RELEASE_LABEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('ci-{0}', github.run_id) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ./src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Verify third-party license bundle
        run: npm run licenses:check

      - name: Test web domain logic
        run: npm test

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build macOS app
        run: npm run tauri -- build --target aarch64-apple-darwin --features custom-protocol --ci

      - name: Sign, verify, and package app
        run: ./scripts/macos-package.sh "$RELEASE_LABEL"
        env:
          MACOS_APP_PATH: ${{ github.workspace }}/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Where To Study.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-macos-arm64
          path: release-artifacts/*
          if-no-files-found: error
