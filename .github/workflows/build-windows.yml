name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".gitattributes"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES.html"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/verify-github-attestation.sh"
      - "vite.config.js"
      - ".github/workflows/build-windows.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "package-lock.json"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES.html"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/verify-github-attestation.sh"
      - "vite.config.js"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: ./src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Verify third-party license bundle
        run: npm run licenses:check

      - name: Test web domain logic
        run: npm test

      - name: Build web frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust core
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Run strict Clippy checks
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build Windows bundle
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --features custom-protocol --bundles nsis --ci

      - name: Package versioned Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $source) {
            throw "Windows NSIS installer was not produced."
          }

          $label = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            "ci-$($env:GITHUB_SHA.Substring(0, 12))"
          }
          if ($label -notmatch '^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$') {
            throw "Invalid release label: $label"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          $output = "release-artifacts/Where-To-Study-$label-windows-x64-setup.exe"
          Copy-Item $source.FullName $output
          $hash = (Get-FileHash -Algorithm SHA256 $output).Hash.ToLowerInvariant()
          $checksumPath = "$output.sha256"
          $checksumLine = "$hash  $(Split-Path -Leaf $output)`n"
          [System.IO.File]::WriteAllText($checksumPath, $checksumLine, [System.Text.Encoding]::ASCII)

          $checksumBytes = [System.IO.File]::ReadAllBytes($checksumPath)
          if ($checksumBytes -contains [byte]13) {
            throw "Windows checksum sidecar contains a carriage return."
          }
          if ([System.Text.Encoding]::ASCII.GetString($checksumBytes) -cne $checksumLine) {
            throw "Windows checksum sidecar did not round-trip exactly."
          }

          $installDirectory = Join-Path $env:RUNNER_TEMP "where-to-study-nsis-$env:GITHUB_RUN_ID"
          $installer = Start-Process -FilePath (Resolve-Path $output) -ArgumentList @("/S", "/D=$installDirectory") -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Windows NSIS installer smoke test failed with exit code $($installer.ExitCode)."
          }

          try {
            foreach ($legalFile in @("LICENSE", "THIRD_PARTY_LICENSES.html", "THIRD_PARTY_NOTICES.md")) {
              $expectedPath = Join-Path $env:GITHUB_WORKSPACE $legalFile
              $expectedHash = (Get-FileHash -Algorithm SHA256 $expectedPath).Hash
              $matchingFiles = Get-ChildItem $installDirectory -Recurse -File -Filter $legalFile |
                Where-Object { (Get-FileHash -Algorithm SHA256 $_.FullName).Hash -eq $expectedHash }
              if (-not $matchingFiles) {
                throw "Installed Windows app is missing the exact $legalFile file."
              }
            }
            $appExecutable = Get-ChildItem $installDirectory -Recurse -File -Filter "*.exe" |
              Where-Object { $_.Name -notmatch "(?i)uninstall" } |
              Sort-Object Length -Descending |
              Select-Object -First 1
            if (-not $appExecutable) {
              throw "Installed Windows app is missing its main executable."
            }
            $binaryText = [System.Text.Encoding]::Latin1.GetString(
              [System.IO.File]::ReadAllBytes($appExecutable.FullName)
            )
            $legacyContestHost = "{0}.{1}.{2}.{3}" -f 101, 201, 29, 29
            if ($binaryText.Contains($legacyContestHost)) {
              throw "Installed Windows executable contains the retired contest API host."
            }
            foreach ($endpoint in @(
              "https://where-to-study.cn/api/contest-events",
              "https://where-to-study.cn/api/contest-notices",
              "https://where-to-study.cn/api/shuttle-bus"
            )) {
              if (-not $binaryText.Contains($endpoint)) {
                throw "Installed Windows executable is missing a required HTTPS public-data endpoint: $endpoint"
              }
            }
          } finally {
            $uninstaller = Get-ChildItem $installDirectory -Recurse -File -Filter "*uninstall*.exe" |
              Select-Object -First 1
            if ($uninstaller) {
              Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
            }
            if (Test-Path $installDirectory) {
              Remove-Item -Recurse -Force $installDirectory
            }
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-windows
          path: |
            release-artifacts/*.exe
            release-artifacts/*.exe.sha256
          if-no-files-found: error

  attest-windows:
    name: Attest Windows release installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout verification script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Windows release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: where-to-study-windows
          path: release-artifacts

      - name: Attest Windows release installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/*.exe

      - name: Verify Windows release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' installers < <(find release-artifacts -maxdepth 1 -type f -name '*.exe' -print0)
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one Windows installer, found ${#installers[@]}." >&2
            exit 1
          fi
          ./scripts/verify-github-attestation.sh \
            "$GITHUB_REPOSITORY" \
            .github/workflows/build-windows.yml \
            "${installers[@]}"
