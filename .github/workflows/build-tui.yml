name: Build TUI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "wts-tui/**"
      - "where-to-study-core/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "scripts/verify-github-attestation.sh"
      - ".github/workflows/build-tui.yml"
  pull_request:
    paths:
      - "wts-tui/**"
      - "where-to-study-core/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "scripts/verify-github-attestation.sh"
      - ".github/workflows/build-tui.yml"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            ./src-tauri
            ./where-to-study-core
            ./wts-tui

      - name: Check Rust formatting
        run: cargo fmt --manifest-path wts-tui/Cargo.toml --all -- --check

      - name: Run strict Clippy checks
        run: cargo clippy --manifest-path wts-tui/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test TUI
        run: cargo test --manifest-path wts-tui/Cargo.toml --locked

      - name: Build TUI release
        run: cargo build --manifest-path wts-tui/Cargo.toml --release --locked

      - name: Verify TUI binary
        run: |
          file wts-tui/target/release/where-to-study-tui
          wts-tui/target/release/where-to-study-tui --version

      - name: Upload TUI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-tui-macos-arm64
          path: wts-tui/target/release/where-to-study-tui
          if-no-files-found: error

  linux:
    name: Linux TUI (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: |
            ./where-to-study-core
            ./wts-tui

      - name: Test and build TUI
        run: |
          set -euo pipefail
          cargo test --manifest-path wts-tui/Cargo.toml --locked
          cargo build --manifest-path wts-tui/Cargo.toml --release --locked
          file wts-tui/target/release/where-to-study-tui
          wts-tui/target/release/where-to-study-tui --version | grep -F '0.2.8'
          [[ "$(uname -m)" == "${{ matrix.arch }}" ]]

      - name: Package Linux TUI
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          archive="where-to-study-tui-linux-${{ matrix.arch }}.tar.gz"
          tar -C wts-tui/target/release -czf "release-artifacts/$archive" where-to-study-tui
          tar -tzf "release-artifacts/$archive" | grep -qx 'where-to-study-tui'
          (cd release-artifacts && sha256sum "$archive" > "$archive.sha256")

      - name: Upload Linux TUI archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: where-to-study-tui-linux-${{ matrix.arch }}
          path: |
            release-artifacts/where-to-study-tui-linux-${{ matrix.arch }}.tar.gz
            release-artifacts/where-to-study-tui-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  attest-linux:
    name: Attest Linux TUI archives
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout verification script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Linux TUI release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: where-to-study-tui-linux-*
          path: release-artifacts
          merge-multiple: true

      - name: Attest Linux TUI archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-artifacts/*.tar.gz

      - name: Verify Linux TUI attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' archives < <(find release-artifacts -maxdepth 1 -type f -name '*.tar.gz' -print0)
          if (( ${#archives[@]} != 2 )); then
            echo "Expected two Linux TUI archives, found ${#archives[@]}." >&2
            exit 1
          fi
          ./scripts/verify-github-attestation.sh \
            "$GITHUB_REPOSITORY" \
            .github/workflows/build-tui.yml \
            "${archives[@]}"
