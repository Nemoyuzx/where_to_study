name: Build TUI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "wts-tui/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/build-tui.yml"
  pull_request:
    paths:
      - "wts-tui/**"
      - "src-tauri/src/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - ".github/workflows/build-tui.yml"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
        with:
          workspaces: |
            ./src-tauri
            ./wts-tui

      - name: Check Rust formatting
        run: cargo fmt --manifest-path wts-tui/Cargo.toml --all -- --check

      - name: Run strict Clippy checks
        run: cargo clippy --manifest-path wts-tui/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test TUI
        run: cargo test --manifest-path wts-tui/Cargo.toml --locked

      - name: Build TUI release
        run: cargo build --manifest-path wts-tui/Cargo.toml --release --locked

      - name: Verify TUI binary
        run: |
          file wts-tui/target/release/wts-tui
          wts-tui/target/release/wts-tui --version

      - name: Upload TUI binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wts-tui-macos
          path: wts-tui/target/release/wts-tui
          if-no-files-found: error
