name: Security contact request
description: Request a private channel without publishing vulnerability details.
title: "[Security contact] "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include reproduction steps, exploit details, credentials, tokens, personal data, logs, screenshots, or attachments. Read `SECURITY.md` first.
  - type: input
    id: affected_ref
    attributes:
      label: Affected version or commit
      placeholder: v0.1.1-alpha.5 or 0123456789abcdef...
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Broad category
      options:
        - Credential or secret handling
        - Authentication or transport
        - Local IPC or command authorization
        - Installer, update, or signing integrity
        - Dependency vulnerability
        - Personal or cached data exposure
        - Other security boundary
    validations:
      required: true
  - type: input
    id: impact_summary
    attributes:
      label: Non-sensitive impact summary
      description: Use one broad sentence only; omit the trigger, exploit path, and affected identities.
      placeholder: A local trust boundary may be bypassed under specific conditions.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Public disclosure checks
      options:
        - label: I have not included technical vulnerability details or proof of concept.
          required: true
        - label: I have not included credentials, personal data, logs, screenshots, or attachments.
          required: true
        - label: I understand that this request does not have a promised response SLA.
          required: true
