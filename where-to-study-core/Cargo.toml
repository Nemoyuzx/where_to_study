[package]
name = "where-to-study-core"
version = "0.3.1"
description = "Headless shared services for Where To Study clients"
authors = ["Nemoyu"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.89"

[lib]
name = "where_to_study_lib"
path = "src/lib.rs"

[features]
default = []
tauri-runtime = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mobile)'] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
getrandom = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["sync", "macros", "rt"] }
zeroize = { version = "1", features = ["derive"] }
