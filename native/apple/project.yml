name: WhereToStudyNative
options:
  bundleIdPrefix: com.nemoyu.wheretostudy
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "40"
    CODE_SIGN_STYLE: Automatic
targets:
  WhereToStudyMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/Shared
      - path: Sources/macOS
      - path: Sources/WidgetShared
      - path: ../../src-tauri/icons/icon.icns
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../THIRD_PARTY_LICENSES.html
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Generated/WhereToStudyMac-Info.plist
      properties:
        CFBundleDisplayName: Where To Study
        CFBundleIconFile: icon.icns
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        NSCalendarsFullAccessUsageDescription: 将个人课表中的课程写入系统日历，并在重复导入时更新已有课程。
        NSCalendarsUsageDescription: 将个人课表中的课程写入系统日历。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nemoyu.wheretostudy.native.macos
        PRODUCT_NAME: WhereToStudyMac
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        CODE_SIGN_ENTITLEMENTS: Resources/WhereToStudyMac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(APPLE_MACOS_PROFILE_SPECIFIER)
          ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: WhereToStudyWidget
    scheme:
      testTargets:
        - WhereToStudyMacTests
  WhereToStudyWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/WidgetShared
      - path: Sources/Widget
      - path: Sources/Shared/Models.swift
    info:
      path: Generated/WhereToStudyWidget-Info.plist
      properties:
        CFBundleDisplayName: Where To Study
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nemoyu.wheretostudy.native.macos.widget
        PRODUCT_NAME: WhereToStudyWidget
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: Resources/WhereToStudyWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(APPLE_WIDGET_PROFILE_SPECIFIER)
  WhereToStudyiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/Shared
      - path: Sources/iOS
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../../LICENSE
        buildPhase: resources
      - path: ../../THIRD_PARTY_LICENSES.html
        buildPhase: resources
      - path: ../../THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Generated/WhereToStudyiOS-Info.plist
      properties:
        CFBundleDisplayName: Where To Study
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: 将个人课表中的课程写入系统日历，并在重复导入时更新已有课程。
        NSCalendarsUsageDescription: 将个人课表中的课程写入系统日历。
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nemoyu.wheretostudy.native.macos
        PRODUCT_NAME: WhereToStudyiOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(APPLE_IOS_PROFILE_SPECIFIER)
    scheme:
      testTargets:
        - WhereToStudyiOSTests
        - WhereToStudyiOSUITests
  WhereToStudyMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: WhereToStudyMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nemoyu.wheretostudy.native.tests
        CODE_SIGNING_ALLOWED: NO
  WhereToStudyiOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: WhereToStudyiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nemoyu.wheretostudy.native.ios.tests
        CODE_SIGNING_ALLOWED: NO
  WhereToStudyiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: WhereToStudyiOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nemoyu.wheretostudy.native.ios.ui-tests
        CODE_SIGNING_ALLOWED: NO
