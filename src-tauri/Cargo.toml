[package]
name = "where_to_study"
version = "0.1.0"
description = "BUPT empty classroom planner for macOS"
authors = ["Nemoyu"]
edition = "2021"

[lib]
name = "where_to_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calamine = "0.35"
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
regex = "1"
reqwest = { version = "0.12", features = ["json", "cookies", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "2", features = [] }
